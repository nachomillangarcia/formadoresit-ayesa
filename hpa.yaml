apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-java
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-java-deployment
  minReplicas: 1
  maxReplicas: 4
  metrics:
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 50

  # - type: Resource
  #   resource:
  #     name: memory
  #     target:
  #       type: AverageValue
  #       averageValue: 500Mi

  behavior:
    scaleDown:
      stabilizationWindowSeconds: 1800
      policies:
      - type: Pods
        value: 1
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      # - type: Percent
      #   value: 100
      #   periodSeconds: 15
      - type: Pods
        value: 1
        periodSeconds: 300
      selectPolicy: Max