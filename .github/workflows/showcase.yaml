name: Showcase

# Triggers
on:
  push:
    branches: [ main ]
  
  workflow_dispatch:


jobs:
  showcase:
    runs-on: ubuntu-24.04
    outputs:
      fruit: ${{steps.set_outputs.outputs.fruit}}
      count: ${{steps.set_outputs.outputs.count}}
    steps:
      - run: echo "🎉 The job was automatically triggered by a ${{ github.event_name }} event."

      - run: echo "🐧 This job is now running on a ${{ runner.os }} server hosted by GitHub!"

      - run: echo "🔎 The name of your branch is ${{ github.ref }} and your repository is ${{ github.repository }}."

      - run: echo "💡 The ${{ github.repository }} repository has been cloned to the runner."

      - run: echo "🖥️ The workflow is now ready to test your code on the runner."         


      - name: Checkout repository
        uses: actions/checkout@v4     

      - name: List files in the repository
        run: | 
          ls .
          pwd

      - name: Dump GitHub context
        env:
          GITHUB_CONTEXT: ${{ toJson(github) }}
        run: echo "$GITHUB_CONTEXT"

      - name: Use helm
        run: helm -h

      # Output
      - name: Set outputs
        id: set_outputs
        run: |
            echo "fruit=apple" >> $GITHUB_OUTPUT
            echo "count=42" >> $GITHUB_OUTPUT     

      - name: Read outputs
        run: |
            echo "I have ${{ steps.set_outputs.outputs.count }} ${{ steps.set_outputs.outputs.fruit }}(s)"

      # Artifacts
      - run: echo "This is an artifact" > output.txt

      - uses: actions/upload-artifact@v4
        with:
            name: output
            path: output.txt

      # Conditional steps
      - name: Run on push
        if: github.event_name == 'push'
        run: echo "This Job only triggers at push events"
        
      - name: Run on dispatch
        if: github.event_name == 'workflow_dispatch'
        run: echo "This Job only triggers at workflow_dispatch events"

  dependent:
    needs: showcase
    runs-on: ubuntu-24.04
    steps:
      - run: echo "I have ${{ needs.showcase.outputs.count }} ${{ needs.showcase.outputs.fruit }}(s)"

  using_container:
    runs-on: ubuntu-24.04
    container:
      image: alpine/helm
    steps:
      # Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run helm
        run: helm -h  