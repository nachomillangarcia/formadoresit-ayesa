apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
spec:
  replicas: 1
  strategy: 
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: nginx
  template:  
    metadata:
      labels:
        app: nginx
      annotations:
        co.elastic.logs/module: "nginx"
        co.elastic.logs/fileset.stdout: "access"
    spec:
      serviceAccountName: nginx
      # imagePullSecrets:
      # - name: regcred
      containers:
        - name: nginx
          image: nginx:1.29
          ports:
          - containerPort: 80
            name: http
          - containerPort: 8081
            name: metrics
          resources:
            limits:
              cpu: 300m
              memory: 128Mi
            requests:
              cpu: 100m
              memory: 64Mi

          livenessProbe:
            httpGet:
              path: /
              port: 80
            failureThreshold: 3
            periodSeconds: 5

          startupProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 5

          readinessProbe:
            httpGet:
              path: /
              port: 80
            failureThreshold: 3
            periodSeconds: 5

          env:
            - name: MY_VAR
              value: MY_VALUE
            # - name: LOG_LEVEL
            #   valueFrom:
            #     configMapKeyRef:
            #       name: api-java
            #       key: LOG_LEVEL
            - name: MY_POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          # envFrom:
          #   - configMapRef:
          #       name: api-java
          # command:
          args:
            - nginx-debug
            - '-g'
            - 'daemon off;'

          volumeMounts:
          - name: config
            mountPath: /etc/nginx/nginx.conf
            subPath: nginx.conf
          - name: config
            mountPath: /etc/nginx/conf.d/status.conf
            subPath: status.conf
          #   subPath: nginx.conf
          # - name: data
          #   mountPath: /persistent-disk 
        - name: metrics-exporter
          image: nginx/nginx-prometheus-exporter:1.5.1
          ports:
          - containerPort: 9113
            name: prometheus
          args:
          - --nginx.scrape-uri=http://127.0.0.1:8081/stub_status

      volumes:
        - name: config
          configMap:
            name: config-nginx
        # - name: data
        #   persistentVolumeClaim:
        #     claimName: local-hostpath-pvc
      
      nodeSelector:
        app: data-processing

      affinity:
        nodeAffinity:
          # requiredDuringSchedulingIgnoredDuringExecution:
          #   nodeSelectorTerms:
          #   - matchExpressions:
          #     - key: topology.kubernetes.io/zone
          #       operator: In
          #       values:
          #       - eu-central-1a
          #       - eu-central-1b
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 1
            preference:
              matchExpressions:
              - key: node-role.kubernetes.io/worker
                operator: In
                values:
                - worker

        # podAntiAffinity:
        #   requiredDuringSchedulingIgnoredDuringExecution:
        #   - labelSelector:
        #       matchExpressions:
        #       - key: app
        #       operator: In
        #       values:
        #       - nginx
        #     topologyKey: "kubernetes.io/hostname"

      tolerations:
        - key: "workload"
          operator: "Equal"
          value: "database"
          effect: "NoSchedule"

      priorityClassName: high-priority